name = "pointandyap"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "c0d4f5623f4ed222585b3ff7782789ec"
workers_dev = false
# pointandyap.com and www are attached as Worker custom domains (PUT /accounts/<id>/workers/domains); the deploy
# token may not write zone routes, so they are not listed here.

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Page views, downloads, installer runs and update checks (see track() in worker.js). VISITOR_SALT is a secret.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "pointandyap_events"
